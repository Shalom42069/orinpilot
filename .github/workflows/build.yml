name: Build APK

on:
  push:
    branches-ignore: [apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OrinPilot-apk
          path: app/build/outputs/apk/**/*.apk
      - name: Publish APK to apk branch
        run: |
          mkdir /tmp/out && cp app/build/outputs/apk/debug/*.apk /tmp/out/OrinPilot-debug.apk && cp app/build/outputs/apk/release/*.apk /tmp/out/OrinPilot.apk
          cd /tmp/out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "APK ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
